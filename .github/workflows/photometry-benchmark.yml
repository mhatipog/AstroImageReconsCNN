name: Evaluate point-source science metrics
on:
  workflow_dispatch:
  push:
    branches: [research-six-galaxy-source-benchmark]
permissions:
  contents: read
jobs:
  six-galaxy-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible scientific environment
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0 astropy==7.1.0 pytest==9.1.1
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Test source normalization and photometric estimator
        run: python -m pytest -q tests/test_benchmark_photometry.py
      - name: Evaluate all six held-out networks
        run: python -u benchmark_photometry.py --galaxies M31 Hoag M51a M81 M101 M104 --snrs 3 5 10 20 --psf 5 4 --seeds 0 1 --sites 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-galaxy-photometry-study
          path: reproduced/science_benchmark/*.csv
          retention-days: 30
          if-no-files-found: ignore
