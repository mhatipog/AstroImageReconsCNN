name: Independent empirical CNN response calibration
on:
  workflow_dispatch:
  push:
    branches: [research-effective-response-calibration]
    paths:
      - effective_response_calibration.py
      - .github/workflows/effective-response-calibration.yml
permissions:
  contents: read
jobs:
  response:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0 scikit-image==0.26.0 astropy==7.1.0
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Infer independent calibration templates and evaluate held-out images
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -u effective_response_calibration.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: independent-source-response-calibration
          path: |
            results/effective_response_trials.csv
            results/effective_response_summary.csv
          retention-days: 30
