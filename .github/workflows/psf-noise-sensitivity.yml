name: Scientific sensitivity of archived 3-CNN
on:
  workflow_dispatch:
  push:
    branches: [research-psf-noise-sensitivity]
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific environment
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0 pytest==9.1.1 astropy==7.1.0
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Test physical input model
        run: python -m pytest -q tests/test_psf_noise_sensitivity.py
      - name: Compare fixed trained CNN under observational shifts
        run: python -u psf_noise_sensitivity.py
      - name: Preserve numerical observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psf-noise-sensitivity-pilot
          path: |
            reproduced/psf_noise_sensitivity.csv
            reproduced/psf_noise_summary.csv
          retention-days: 30
          if-no-files-found: ignore
