name: Inspect archived Keras 1 weights
on:
  workflow_dispatch:
  push:
    branches: [investigate-legacy-cnn-inference]
permissions:
  contents: read
jobs:
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'h5py>=3.10,<4'
      - run: python inspect_legacy_cnn.py
