name: Reproduce 2017 experimental outputs
on:
  workflow_dispatch:
  push:
    branches: [reproduce-eusipco2017-results]
  pull_request:
    paths:
      - reproduce_table1.py
      - reproduce_figure3.py
      - tests/test_reproduce_table1.py
      - res/**
      - data/M51a.fits
      - .github/workflows/reproduce-table1.yml
permissions:
  contents: read
jobs:
  archived-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'matplotlib>=3.8,<4' 'astropy>=6,<9' pytest
      - run: python -m pytest -q tests/test_reproduce_table1.py
      - run: python reproduce_table1.py
      - run: python reproduce_figure3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-reproductions
          path: |
            reproduced/table1.csv
            reproduced/figure3.png
          if-no-files-found: warn
