name: Verify archived 3-CNN full-image inference

on:
  workflow_dispatch:
  push:
    branches: [restore-cnn-inference-verified]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scientific dependencies
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0 pytest==9.1.1
      - name: Install tested CPU PyTorch
        run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Test spatial tiling against dense inference
        run: python -m pytest -q tests/test_full_image_inference.py
      - name: Reproduce all original M51a pixels
        run: python -u full_image_inference.py --verify
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: restored-m51a-3cnn
          path: reproduced/m51a_3cnn_modern.mat
          retention-days: 14
