name: Test observation-adaptive photometry
on:
  workflow_dispatch:
  push:
    branches: [research-adaptive-source-response]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 h5py==3.16.0 scikit-image==0.26.0 astropy==7.1.0 pytest==9.1.1
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_adaptive_response.py
      - run: python -u adaptive_response_photometry.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-response-photometry-results
          path: results/adaptive_response_*.csv
          retention-days: 30
          if-no-files-found: ignore
